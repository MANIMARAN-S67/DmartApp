<!-- dmartProductRecordDashboard.html -->
<template>
    <lightning-card title="Product Details & Sales Dashboard" icon-name="custom:custom17">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>
        <template if:false={isLoading}>
            <div class="slds-p-around_medium">
                <template if:true={productInfo}>
                    <div class="slds-grid slds-wrap slds-box slds-box_x-small slds-m-bottom_medium slds-theme_default">
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <p class="slds-text-title slds-m-bottom_xx-small">Product Name</p>
                            <p class="slds-text-heading_small"><strong>{productInfo.Name}</strong></p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <p class="slds-text-title slds-m-bottom_xx-small">Category</p>
                            <p><strong>{productInfo.Category__c}</strong></p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <p class="slds-text-title slds-m-bottom_xx-small">Price</p>
                            <p><strong><lightning-formatted-number value={productInfo.Price__c} format-style="currency" currency-code="INR"></lightning-formatted-number></strong></p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <p class="slds-text-title slds-m-bottom_xx-small">Stock Quantity</p>
                            <p><strong>{productInfo.Stock_Quantity__c}</strong></p>
                        </div>
                    </div>
                </template>

                <p class="slds-text-heading_small slds-m-bottom_small slds-m-top_medium">Recent Purchases ({purchasesCount})</p>
                <template if:true={hasPurchases}>
                    <div style="height: 300px;">
                        <lightning-datatable 
                            key-field="Id" 
                            data={recentPurchases} 
                            columns={purchaseColumns} 
                            hide-checkbox-column="true">
                        </lightning-datatable>
                    </div>
                </template>
                <template if:false={hasPurchases}>
                    <p class="slds-text-color_weak slds-text-align_center slds-p-around_medium border">No purchases found for this product yet.</p>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
