<!-- dmartUserRecordDashboard.html -->
<template>
    <lightning-card title="User Activity Dashboard" icon-name="standard:dashboard">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>
        <template if:false={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-tabset>
                    <lightning-tab label={ordersTabLabel}>
                        <template if:true={hasOrders}>
                            <lightning-accordion active-section-name={activeSections} allow-multiple-sections-open>
                                <template for:each={orders} for:item="order">
                                    <lightning-accordion-section name={order.Id} label={order.Name} key={order.Id}>
                                        <div class="slds-grid slds-wrap slds-m-bottom_medium">
                                            <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                                <p class="slds-text-title">Order ID</p>
                                                <p><strong>{order.order_Id__c}</strong></p>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                                <p class="slds-text-title">Total Amount</p>
                                                <p><strong><lightning-formatted-number value={order.Total_Amount__c} format-style="currency" currency-code="INR"></lightning-formatted-number></strong></p>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                                <p class="slds-text-title">Status</p>
                                                <p><strong>{order.Order_Status__c}</strong></p>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                                <p class="slds-text-title">Payment Status</p>
                                                <p><strong>{order.Payment_Status__c}</strong></p>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2">
                                                <p class="slds-text-title">Date</p>
                                                <p><strong>{order.formattedDate}</strong></p>
                                            </div>
                                        </div>
                                        
                                        <template if:true={order.hasItems}>
                                            <div class="slds-m-top_small slds-box slds-box_x-small">
                                                <lightning-datatable 
                                                    key-field="Id" 
                                                    data={order.items} 
                                                    columns={orderItemColumns} 
                                                    hide-checkbox-column="true">
                                                </lightning-datatable>
                                            </div>
                                        </template>
                                    </lightning-accordion-section>
                                </template>
                            </lightning-accordion>
                        </template>
                        <template if:false={hasOrders}>
                            <p class="slds-text-align_center slds-text-color_weak slds-m-top_medium slds-m-bottom_medium">No orders found for this user.</p>
                        </template>
                    </lightning-tab>
                    
                    <lightning-tab label={logsTabLabel}>
                        <template if:true={hasLogs}>
                            <div class="slds-m-top_small" style="height: 300px;">
                                <lightning-datatable 
                                    key-field="Id" 
                                    data={activityLogs} 
                                    columns={logColumns} 
                                    hide-checkbox-column="true">
                                </lightning-datatable>
                            </div>
                        </template>
                        <template if:false={hasLogs}>
                            <p class="slds-text-align_center slds-text-color_weak slds-m-top_medium slds-m-bottom_medium">No activity logs found for this user.</p>
                        </template>
                    </lightning-tab>
                </lightning-tabset>
            </div>
        </template>
    </lightning-card>
</template>
