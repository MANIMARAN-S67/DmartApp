<!-- dmartActivityLogRecordDashboard.html -->
<template>
    <lightning-card title="Activity Log Details" icon-name="standard:log_a_call">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>
        <template if:false={isLoading}>
            <div class="slds-p-around_medium">
                <template if:true={logInfo}>
                    <div class="slds-grid slds-wrap slds-box slds-box_x-small slds-m-bottom_medium slds-theme_default">
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <p class="slds-text-title slds-m-bottom_xx-small">Action</p>
                            <p class="slds-text-heading_small"><strong>{logInfo.Action__c}</strong></p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <p class="slds-text-title slds-m-bottom_xx-small">API Path</p>
                            <p><strong>{logInfo.Path__c}</strong></p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <p class="slds-text-title slds-m-bottom_xx-small">Timestamp</p>
                            <p><strong>{formattedDate}</strong></p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                            <p class="slds-text-title slds-m-bottom_xx-small">Details</p>
                            <p><strong>{logInfo.Details__c}</strong></p>
                        </div>
                    </div>
                </template>

                <template if:true={userInfo}>
                    <div class="slds-box slds-box_x-small slds-theme_shade">
                        <p class="slds-text-heading_small slds-m-bottom_small">Associated User</p>
                        <p><strong>Name:</strong> {userInfo.Name}</p>
                        <p><strong>Email:</strong> {userInfo.Email__c}</p>
                    </div>
                </template>
                <template if:false={userInfo}>
                    <div class="slds-box slds-box_x-small slds-theme_shade">
                        <p class="slds-text-color_weak">No valid user associated with this log.</p>
                    </div>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
