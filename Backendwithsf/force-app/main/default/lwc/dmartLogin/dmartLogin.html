<template>
    <div class="mobile-mockup-wrapper">
        <div class="login-screen">
            
            <!-- Logo & Titles (No back button) -->
            <div class="branding">
                <div class="logo-box">
                    <svg viewBox="0 0 40 40" width="36" height="36" class="logo-icon">
                        <path d="M14 16v-4c0-3.3 2.7-6 6-6s6 2.7 6 6v4" fill="none" stroke="#00c853" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M10 16l2 16c.1.9 1 1.5 1.9 1.5h12.2c.9 0 1.7-.6 1.9-1.5l2-16H10z" fill="none" stroke="#00c853" stroke-width="2.5" stroke-linejoin="round"/>
                    </svg>
                    <span class="logo-text">DMART</span>
                </div>
                <h1 class="main-title">Sign In</h1>
                <p class="subtitle">Access your DMart account securely.</p>
            </div>
            
            <!-- Error State -->
            <template if:true={errorMessage}>
                <div class="error-msg">{errorMessage}</div>
            </template>
            
            <!-- Google Sign Up/In -->
            <div class="social-login">
                <div class="info-pill">First time here? Please sign up with Google.</div>
                <button class="btn google-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Continue with Google
                </button>
            </div>
            
            <!-- Divider -->
            <div class="divider">
                <span>OR LOGIN WITH</span>
            </div>
            
            <!-- Email / Phone Toggle -->
            <div class="toggle-container">
                <button class={emailBtnClass} data-mode="Email" onclick={handleModeToggle}>Email</button>
                <button class={phoneBtnClass} data-mode="Phone" onclick={handleModeToggle}>Phone</button>
            </div>
            
            <!-- Form Fields -->
            <div class="form-container">
                <div class="input-group">
                    <label>{loginMode} ADDRESS</label>
                    <div class="input-wrapper">
                        <template if:true={isEmailMode}>
                            <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="currentColor"/></svg>
                        </template>
                        <template if:true={isPhoneMode}>
                            <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="currentColor"/></svg>
                        </template>
                        <input type="text" placeholder={identifierPlaceholder} value={identifier} oninput={handleIdentifierChange} class="custom-input" />
                    </div>
                </div>
                
                <div class="input-group">
                    <label>PASSWORD</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="currentColor"/></svg>
                        <input type="password" placeholder="••••••••" value={password} oninput={handlePasswordChange} class="custom-input" />
                    </div>
                </div>
                
                <button class="btn submit-btn" onclick={handleLogin}>
                    Confirm Sign In 
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 13h11.17l-4.88 4.88c-.39.39-.39 1.03 0 1.42.39.39 1.02.39 1.41 0l6.59-6.59c.39-.39.39-1.02 0-1.41l-6.58-6.6a.996.996 0 1 0-1.41 1.41L16.17 11H5c-.55 0-1 .45-1 1s.45 1 1 1z" fill="currentColor"/></svg>
                </button>
            </div>
            
            <div class="footer-link">
                <span class="muted-text">Want to join DMart?</span>
                <button class="text-btn" onclick={goToRegister}>Create an Account</button>
            </div>
            
        </div>
    </div>
</template>
