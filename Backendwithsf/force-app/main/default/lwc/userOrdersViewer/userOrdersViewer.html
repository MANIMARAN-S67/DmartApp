<template>
    <lightning-card title="DMart Orders" icon-name="standard:orders">
        <div class="slds-p-around_medium">
            <template if:true={hasOrders}>
                <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                    <template for:each={orders} for:item="order">
                        <lightning-accordion-section 
                            key={order.Id} 
                            name={order.Id} 
                            label={order.Name}>
                            
                            <div class="slds-grid slds-wrap slds-m-bottom_medium">
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <p class="slds-text-title">Order ID</p>
                                    <p class="slds-text-body_regular">{order.order_Id__c}</p>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <p class="slds-text-title">Order Date</p>
                                    <p class="slds-text-body_regular">{order.formattedDate}</p>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <p class="slds-text-title">Total Amount</p>
                                    <lightning-formatted-number value={order.Total_Amount__c} format-style="currency" currency-code="INR"></lightning-formatted-number>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <p class="slds-text-title">Payment Status</p>
                                    <p class="slds-text-body_regular">{order.Payment_Status__c}</p>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <p class="slds-text-title">Order Status</p>
                                    <p class="slds-text-body_regular">
                                        <lightning-badge label={order.Order_Status__c}></lightning-badge>
                                    </p>
                                </div>
                            </div>
                            
                            <template if:true={order.hasItems}>
                                <p class="slds-text-heading_small slds-m-bottom_small">Order Products</p>
                                <lightning-datatable
                                    key-field="Id"
                                    data={order.items}
                                    columns={columns}
                                    hide-checkbox-column="true">
                                </lightning-datatable>
                            </template>
                            <template if:false={order.hasItems}>
                                <p class="slds-text-color_weak slds-m-top_small">No items in this order.</p>
                            </template>
                            
                        </lightning-accordion-section>
                    </template>
                </lightning-accordion>
            </template>
            <template if:false={hasOrders}>
                <div class="slds-text-align_center slds-text-color_weak slds-p-around_medium">
                    <p>No orders found for this user.</p>
                </div>
            </template>
            <template if:true={error}>
                <div class="slds-text-color_error slds-p-around_medium">
                    Error loading orders: {error.body.message}
                </div>
            </template>
        </div>
    </lightning-card>
</template>
